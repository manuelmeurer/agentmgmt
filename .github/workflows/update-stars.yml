name: Update GitHub stars

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6

      - run: npm ci --ignore-scripts

      - run: node scripts/update-stars.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - name: Commit changes to main
        run: |
          git add src/tools.yml dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh GitHub star counts"
          git push origin HEAD:main

      - name: Sync deploy branch with main
        run: |
          git fetch origin main
          git push origin origin/main:deploy --force
