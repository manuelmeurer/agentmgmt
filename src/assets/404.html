<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 Not Found — Agent MGMT</title>
    <meta name="robots" content="noindex">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111111;
        --muted: #666666;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #e5e5e5;
          --muted: #a3a3a3;
        }
      }

      body {
        align-items: center;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 32rem;
        padding: 3rem 1.5rem;
        text-align: center;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }

      a {
        color: inherit;
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 Not Found</h1>
      <p>This page does not exist.</p>
      <p><a href="/">Back to Agent MGMT</a></p>
    </main>
  </body>
</html>
